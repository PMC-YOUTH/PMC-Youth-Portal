<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>播青｜播恩堂青年团契</title>
<script>if (new URLSearchParams(location.search).get('page') === 'admin') location.replace('admin.html');</script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/api.js"></script>
<script src="js/gas-shim.js"></script>
<style>
:root {
  --forest: #1F4D3A; --forest-2: #2D6A4F; --forest-soft: #E6F0EA; --sprout: #52B788;
  --ink: #1E2B24; --muted: #66756C; --line: #E1E7E2; --paper: #F4F6F3; --card: #FFFFFF;
  --wheat-soft: #FBF1DC; --wheat-ink: #7A5408;
  --radius: 16px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; background: var(--paper); }
body { min-height: 100vh; }
.mobile-login { display: none !important; align-items: center; background: var(--forest); color: #fff; font-weight: 600; font-size: 13.5px; padding: 7px 14px; border-radius: 10px; white-space: nowrap; }
body { margin: 0; background: var(--paper); color: var(--ink); line-height: 1.6; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.container { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

/* 顶栏 */
.header { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { height: 38px; width: auto; border-radius: 8px; display: none; }
.brand-name { font-size: 20px; font-weight: 800; line-height: 1.2; }
.brand-sub { font-size: 12px; color: var(--muted); line-height: 1.3; }
.nav { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { padding: 8px 12px; border-radius: 10px; font-size: 14px; white-space: nowrap; color: #3B4A41; }
.nav a:hover { background: #EEF2EF; }
.nav a.nav-admin { background: var(--forest); color: #fff; font-weight: 600; margin-left: 6px; }
.nav a.nav-admin:hover { background: var(--forest-2); }
.nav a.nav-lang { border: 1px solid var(--line); font-weight: 600; margin-left: 6px; min-width: 44px; text-align: center; }
.mobile-actions { display: none; align-items: center; gap: 6px; }
.mobile-lang { display: inline-flex; align-items: center; border: 1px solid #D5DED8; color: #3B4A41; font-weight: 600; font-size: 13px; padding: 6px 10px; border-radius: 10px; white-space: nowrap; }

/* 封面 */
.hero { margin-top: 24px; border-radius: 22px; min-height: 340px; display: flex; flex-direction: column; justify-content: flex-end; padding: 36px; color: #fff;
  background-color: var(--forest); background-image: radial-gradient(circle at 18% 22%, rgba(82,183,136,.35), transparent 50%), radial-gradient(circle at 85% 85%, rgba(224,165,38,.25), transparent 45%); background-size: cover; background-position: center; }
.hero h1 { margin: 0; font-size: 44px; letter-spacing: 2px; text-shadow: 0 4px 14px rgba(0,0,0,.45); line-height: 1.15; }
.hero p { margin: 8px 0 0; font-size: 17px; font-weight: 500; text-shadow: 0 3px 10px rgba(0,0,0,.45); }

/* 区块 */
.section { padding-top: 44px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.section-head h2 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
.section-head h2::before { content: ""; width: 6px; height: 20px; border-radius: 3px; background: var(--sprout); }
.section-head span { color: var(--muted); font-size: 13px; }

/* 六周聚会 */
.weeks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.week { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 220px; }
.week.now { border-color: var(--sprout); box-shadow: 0 0 0 3px rgba(82,183,136,.18); }
.week.past { opacity: .78; }
.week-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.week-label { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #EEF2EF; color: #4A5850; }
.week.now .week-label { background: var(--forest); color: #fff; }
.week-range { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ev + .ev { border-top: 1px dashed var(--line); padding-top: 12px; }
.ev-date { font-size: 12.5px; font-weight: 600; color: var(--forest-2); }
.ev-name { font-size: 17px; font-weight: 700; margin: 2px 0 2px; line-height: 1.35; }
.ev-meta { font-size: 13px; color: var(--muted); }
.roster { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin-top: 10px; padding: 10px 12px; background: #F6F8F6; border-radius: 10px; font-size: 13.5px; }
.roster dt { color: var(--muted); white-space: nowrap; }
.roster dd { margin: 0; font-weight: 600; word-break: break-word; }
.ev-off { margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: var(--wheat-soft); color: var(--wheat-ink); font-size: 13.5px; }
.week-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13.5px; background: #F6F8F6; border-radius: 10px; min-height: 120px; text-align: center; padding: 12px; }

/* 活动报告 */
.reports { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.report { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.report img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #E9EEEA; display: block; }
.report-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.report-body h3 { margin: 0; font-size: 16px; line-height: 1.4; }
.report-body p { margin: 0; color: #4A5850; font-size: 14px; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.report-link { margin-top: auto; padding-top: 6px; font-size: 13px; font-weight: 600; color: var(--forest-2); }
.chip { display: inline-block; font-size: 12.5px; font-weight: 600; color: var(--forest-2); background: var(--forest-soft); padding: 2px 10px; border-radius: 999px; align-self: flex-start; }
.empty { background: var(--card); border: 1px dashed #CBD6CE; border-radius: var(--radius); padding: 26px; text-align: center; color: var(--muted); grid-column: 1 / -1; }

/* 意见箱 + Instagram */
.duo { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
.box h3 { margin: 0 0 4px; font-size: 18px; }
.box .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }
.fb label { display: block; font-size: 13px; font-weight: 600; color: #3B4A41; margin-bottom: 14px; }
.fb input, .fb select, .fb textarea { display: block; width: 100%; margin-top: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 15px; font-family: inherit; background: #fff; color: inherit; outline: none; }
.fb input:focus, .fb select:focus, .fb textarea:focus { border-color: #3F9D6B; box-shadow: 0 0 0 3px rgba(63,157,107,.15); }
.fb textarea { resize: vertical; line-height: 1.6; }
.fb-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--forest); color: #fff; border: none; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn:hover { background: var(--forest-2); }
.btn:disabled { opacity: .6; cursor: default; }
.fb-error { background: #FBE9E5; color: #C2412D; border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 12px; }
.fb-done { background: var(--forest-soft); color: var(--forest); border-radius: 12px; padding: 18px; line-height: 1.7; }
.fb-note { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.ig { display: flex; flex-direction: column; }
.ig .btn { margin-top: auto; align-self: flex-start; }

.footer { margin-top: 56px; padding: 32px 20px; text-align: center; color: var(--muted); font-size: 13px; background: #fff; border-top: 1px solid var(--line); }
.footer .btn { margin-top: 12px; padding: 10px 20px; font-size: 14px; }
.skeleton { border-radius: var(--radius); min-height: 220px; background: linear-gradient(90deg, #E9EEEA 25%, #F5F7F5 50%, #E9EEEA 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.error { grid-column: 1 / -1; padding: 15px; background: #FBE9E5; color: #9B2C1F; border-radius: 12px; }

@media (max-width: 980px) {
  .weeks, .reports { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .duo { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .header { position: static; backdrop-filter: none; background: #fff; }
  .header-inner { flex-wrap: wrap; gap: 0; min-height: 0; padding: 12px 20px 0; }
  .brand { flex: 1; gap: 8px; }
  .brand img { height: 32px; }
  .brand-name { font-size: 18px; }
  .brand-sub { font-size: 11px; }
  .mobile-login { display: inline-flex !important; }
  .mobile-actions { display: flex; }
  .nav a.nav-lang { display: none; }
  .nav { width: calc(100% + 10px); margin: 8px -10px 0 -10px; padding: 0 0 8px; gap: 2px; }
  .nav a { font-size: 13.5px; padding: 6px 10px; }
  .nav a.nav-admin { display: none; }
  .hero { margin-top: 14px; min-height: 200px; padding: 20px; border-radius: 16px; }
  .hero h1 { font-size: 30px; letter-spacing: 1px; }
  .hero p { font-size: 14px; margin-top: 4px; }
  .section { padding-top: 30px; }
  .section-head { flex-direction: column; align-items: flex-start; gap: 2px; margin-bottom: 12px; }
  .section-head h2 { font-size: 19px; }
  .section-head span { font-size: 12.5px; }
  .weeks, .reports { grid-template-columns: 1fr; gap: 12px; }
  .week { padding: 14px; min-height: 0; gap: 10px; }
  .ev-name { font-size: 16px; }
  .roster { font-size: 13px; padding: 9px 11px; gap: 3px 10px; }
  .fb-row { grid-template-columns: 1fr; gap: 0; }
  .box { padding: 18px; }
  .footer { margin-top: 40px; padding: 26px 16px calc(26px + env(safe-area-inset-bottom)); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a class="brand" href="#top">
      <img id="header-logo" src="" alt="播青 Logo">
      <div><div class="brand-name">播青</div><div class="brand-sub">卫理公会基督教播恩堂 · 青年团契</div></div>
    </a>
    <div class="mobile-actions"><a href="#" class="lang-toggle mobile-lang" data-noi18n onclick="PMC_I18N.toggle();return false;">EN</a><a href="#" class="mobile-login admin-link" target="_top" onclick="return goToAdmin(event)">职员登入</a></div>
    <nav class="nav">
      <a href="#weeks">聚会</a>
      <a href="#reports">活动报告</a>
      <a href="#feedback">意见箱</a>
      <a href="https://www.instagram.com/youth.pmc/?hl=en" target="_blank" rel="noopener">Instagram</a>
      <a href="#" class="lang-toggle nav-lang" data-noi18n onclick="PMC_I18N.toggle();return false;">EN</a>
      <a href="#" class="nav-admin admin-link" target="_top" onclick="return goToAdmin(event)">职员登入</a>
    </nav>
  </div>
</header>

<main id="top">
  <div class="container">
    <section class="hero" id="hero-section">
      <h1>播青</h1>
      <p>卫理公会基督教播恩堂青年团契</p>
    </section>

    <section class="section" id="weeks">
      <div class="section-head">
        <h2>聚会与事奉</h2>
        <span>上周、本周和接下来四周的节目与事奉人员</span>
      </div>
      <div id="weekGrid" class="weeks">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </section>

    <section class="section" id="reports">
      <div class="section-head">
        <h2>活动报告</h2>
        <span>青年团契最新活动</span>
      </div>
      <div id="reportsList" class="reports"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </section>

    <section class="section" id="feedback">
      <div class="section-head">
        <h2>意见箱</h2>
        <span>想法、建议、感恩或代祷事项，都欢迎告诉我们</span>
      </div>
      <div class="duo">
        <div class="box fb">
          <div id="fbDone" class="fb-done" style="display:none;"></div>
          <div id="fbForm">
            <div class="fb-row">
              <label>类别<select id="fbCategory"><option>建议</option><option>感恩</option><option>代祷</option><option>问题反映</option><option>其他</option></select></label>
              <label>称呼（可不填，就是匿名）<input id="fbName" maxlength="40" placeholder="匿名"></label>
            </div>
            <label>内容<textarea id="fbContent" rows="5" maxlength="2000" placeholder="写下你想对青年团契说的话……"></textarea></label>
            <label>联络方式（可不填；希望职员回复你才需要）<input id="fbContact" maxlength="80" placeholder="电话或 Email"></label>
            <input id="fbWebsite" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;">
            <div id="fbError" class="fb-error" style="display:none;"></div>
            <button id="fbSubmit" class="btn" onclick="submitFeedbackClient()">送出意见</button>
            <div class="fb-note">只有团契职员会看到你的意见。</div>
          </div>
        </div>
        <div class="box ig">
          <h3>关注我们的 Instagram</h3>
          <p class="sub">最新活动照片、聚会预告和团契生活，都会先在 Instagram 分享。</p>
          <a class="btn" href="https://www.instagram.com/youth.pmc/?hl=en" target="_blank" rel="noopener">前往 Instagram</a>
        </div>
      </div>
    </section>
  </div>

  <footer class="footer">
    <div>播青 · 卫理公会基督教播恩堂青年团契</div>
    <a href="#" class="btn admin-link" target="_top" onclick="return goToAdmin(event)">职员登入</a>
  </footer>
</main>

<script>
let portalData = null;
let adminPageUrl = '';
const ROLES = [['负责组', '负责组'], ['领会', '领会'], ['经节手册', '经节手册'], ['领唱/助唱', '领唱/助唱'], ['司琴/吉他手', '司琴'], ['电脑控制员', '电脑'], ['招待员', '招待员']];

document.addEventListener('DOMContentLoaded', function() {
  loadPublic();
  google.script.run.withSuccessHandler(function(url) {
    adminPageUrl = url;
    document.querySelectorAll('.admin-link').forEach(function(a) { a.href = url; });
  }).getAdminUrl();
});

// 有网址时直接用连结（iPad 也能正常跳转）；还没取得网址才另外处理
function goToAdmin(ev) {
  if (adminPageUrl) return true;
  if (ev) ev.preventDefault();
  const btns = document.querySelectorAll('.admin-link');
  btns.forEach(function(b) { b.textContent = '跳转中…'; });
  google.script.run.withSuccessHandler(function(url) { window.top.location.href = url; })
    .withFailureHandler(function(error) { alert('跳转失败：' + error.message); btns.forEach(function(b) { b.textContent = '职员登入'; }); })
    .getAdminUrl();
  return false;
}

function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function toDate(value) {
  if (!value) return null;
  const d = new Date(typeof value === 'string' ? value.replace(' ', 'T') : value);
  return isNaN(d.getTime()) ? null : d;
}
function formatDate(value) {
  const d = toDate(value); if (!d) return String(value || '');
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
}
function fmtTime(v) { const m = String(v || '').match(/(\d{1,2}):(\d{2})/); return m ? m[1].padStart(2, '0') + ':' + m[2] : String(v || ''); }
function weekday(d) { return '周' + '日一二三四五六'.charAt(d.getDay()); }
function md(s) { const p = String(s || '').split('-'); return p.length === 3 ? Number(p[2]) + '/' + Number(p[1]) : s; }

function loadPublic() {
  try { const c = JSON.parse(localStorage.getItem('pmcy_public_cache_v2') || 'null'); if (c && c.success) renderPublic(c); } catch (e) {}
  google.script.run
    .withSuccessHandler(function(data) {
      if (!data || !data.success) { showPublicError(data ? data.message : '资料读取失败。'); return; }
      portalData = data;
      try { localStorage.setItem('pmcy_public_cache_v2', JSON.stringify(data)); } catch (e) {}
      renderPublic(data);
    })
    .withFailureHandler(function(error) { showPublicError(error.message); })
    .getPublicPortalData();
}

function renderPublic(data) {
  if (data.logoUrl) {
    const logo = document.getElementById('header-logo');
    logo.src = data.logoUrl; logo.style.display = 'block';
  }
  if (data.bannerUrl) {
    let url = data.bannerUrl;
    const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (m && m[1]) url = 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600';
    document.getElementById('hero-section').style.backgroundImage = 'linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.55)), url(\'' + url + '\')';
  }
  if (data.heroTitle) document.querySelector('#hero-section h1').textContent = data.heroTitle;
  if (data.heroSubtitle) document.querySelector('#hero-section p').textContent = data.heroSubtitle;
  renderWeeks(data.weeks || []);
  renderReports(data.reports || []);
}

function renderWeeks(weeks) {
  const grid = document.getElementById('weekGrid');
  if (!weeks.length) { grid.innerHTML = '<div class="empty">目前没有公开的节目安排。</div>'; return; }
  grid.innerHTML = weeks.map(function(w) {
    const cls = w.offset === 0 ? ' now' : (w.offset < 0 ? ' past' : '');
    const body = (w.events || []).length ? w.events.map(renderEvent).join('') : '<div class="week-empty">这星期没有聚会</div>';
    return '<article class="week' + cls + '"><div class="week-head"><span class="week-label">' + escapeHtml(w.label) + '</span><span class="week-range">' + md(w.start) + ' – ' + md(w.end) + '</span></div>' + body + '</article>';
  }).join('');
}

function renderEvent(ev) {
  const d = toDate(ev['日期']);
  const off = String(ev['状态'] || '') === '暂停';
  const special = !off && ROLES.every(function(r) { return !ev[r[0]]; }) && ev['主题'];
  if (special) return '<div class="ev"><div class="ev-date">' + (d ? d.getDate() + '/' + (d.getMonth() + 1) + ' ' + weekday(d) : '') + '</div><div class="ev-name">' + escapeHtml(ev['节目名称'] || '') + '</div><div class="ev-off" style="background:var(--forest-soft);color:var(--forest);">' + escapeHtml(ev['主题']) + '</div></div>';
  let html = '<div class="ev"><div class="ev-date">' + (d ? d.getDate() + '/' + (d.getMonth() + 1) + ' ' + weekday(d) : '') + (ev['开始时间'] ? '　' + escapeHtml(fmtTime(ev['开始时间'])) : '') + '</div>' +
    '<div class="ev-name">' + escapeHtml(off ? (ev['节目名称'] && ev['节目名称'] !== '暂停聚会' ? ev['节目名称'] : '暂停聚会') : (ev['节目名称'] || '青年团契聚会')) + '</div>';
  if (off) return html + '<div class="ev-off">这一天暂停聚会' + (ev['主题'] && ev['主题'] !== '暂停聚会' ? '：' + escapeHtml(ev['主题']) : '') + '</div></div>';
  const meta = [ev['主题'], ev['地点'] ? '地点：' + ev['地点'] : '', ev['讲员'] ? '讲员：' + ev['讲员'] : ''].filter(Boolean).join('　');
  if (meta) html += '<div class="ev-meta">' + escapeHtml(meta) + '</div>';
  const rows = ROLES.filter(function(r) { return ev[r[0]]; }).map(function(r) { return [r[1], ev[r[0]]]; })
    .concat((ev.extraRoster || []).filter(function(x) { return x.role && x.name; }).map(function(x) { return [x.role, x.name]; }));
  if (rows.length) html += '<dl class="roster">' + rows.map(function(r) { return '<dt>' + escapeHtml(r[0]) + '</dt><dd>' + escapeHtml(r[1]) + '</dd>'; }).join('') + '</dl>';
  return html + '</div>';
}

function renderReports(reports) {
  const box = document.getElementById('reportsList');
  if (!reports.length) { box.innerHTML = '<div class="empty">目前还没有活动报告。</div>'; return; }
  box.innerHTML = reports.map(function(r) {
    let img = String(r['封面照片链接'] || '');
    const m = img.match(/\/d\/([a-zA-Z0-9_-]+)/);

/* 意见箱 */
function submitFeedbackClient() {
  var err = document.getElementById('fbError');
  var content = document.getElementById('fbContent').value.trim();
  err.style.display = 'none';
  if (content.length < 5) { err.textContent = '请写多一点内容（至少 5 个字）。'; err.style.display = 'block'; return; }
  var btn = document.getElementById('fbSubmit');
  btn.disabled = true; btn.textContent = '送出中…';
  google.script.run.withSuccessHandler(function(res) {
    btn.disabled = false; btn.textContent = '送出意见';
    if (!res || !res.success) { err.textContent = (res && res.message) || '送出失败，请稍后再试。'; err.style.display = 'block'; return; }
    document.getElementById('fbForm').style.display = 'none';
    var done = document.getElementById('fbDone');
    done.innerHTML = '<b>谢谢你的意见！</b><div>职员会认真阅读。</div><button class="btn" style="margin-top:14px;" onclick="resetFeedbackForm()">再写一则</button>';
    done.style.display = 'block';
  }).withFailureHandler(function() {
    btn.disabled = false; btn.textContent = '送出意见';
    err.textContent = '送出失败，请检查网络后再试。'; err.style.display = 'block';
  }).submitFeedback({
    category: document.getElementById('fbCategory').value,
    name: document.getElementById('fbName').value,
    content: content,
    contact: document.getElementById('fbContact').value,
    website: document.getElementById('fbWebsite').value
  });
}
function resetFeedbackForm() {
  ['fbName', 'fbContent', 'fbContact'].forEach(function(id) { document.getElementById(id).value = ''; });
  document.getElementById('fbDone').style.display = 'none';
  document.getElementById('fbForm').style.display = '';
}
